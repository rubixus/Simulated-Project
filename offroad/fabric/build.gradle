// Fabric loader module for Create Offroad (Minecraft 26.2 + Create Fly).
// Mirrors offroad:neoforge but targets Fabric Loom.

plugins {
    id 'multiloader-fabric'
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
}

loom {
    // NOTE: single source set (no splitEnvironmentSourceSets): see simulated:fabric.
    mods {
        "offroad" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // NOTE: Modrinth exclusiveContent lives in the ROOT build.gradle
    // (declaring it here too breaks resolution - duplicate exclusive repos).
    maven {
        name = 'ryanhcode-releases'
        url = 'https://maven.ryanhcode.dev/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Create Fly: Fabric port of Create for 26.2 (mod id "create").
    implementation "maven.modrinth:create-fly:${create_fly_version}"

    // fastutil: used in Sable/Veil API signatures (local stubs in :simulated:fabric)
    compileOnly("it.unimi.dsi:fastutil:8.5.15")

    // jsr305: javax.annotation (Nullable etc.) used across common code
    compileOnly("com.google.code.findbugs:jsr305:3.0.2")

    // CC: Tweaked (Fabric 26.2) for ComputerCraft compat
    compileOnly("cc.tweaked:cc-tweaked-26.2-fabric:1.120.2")

    // Veil shader toolchain (signatures used by local Veil stubs)
    compileOnly("gg.moonflower:molang-compiler:3.1.1.19")
    compileOnly("io.github.ocelot:glsl-processor:0.2.3")

    // Depends on the Simulated Fabric module in this project.
    implementation project(':simulated:fabric')

    // TODO(port): Sable Fabric, Veil Fabric, JEI Fabric, Trinkets, CC:Tweaked Fabric (see simulated:fabric).
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
