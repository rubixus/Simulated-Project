// Fabric loader-module conventions for the fabric/26.2 branch.
//
// Applies the shared multiloader-common conventions (archivesName, Java toolchain,
// resource expansion incl. fabric.mod.json) and wires the :common project's
// java + resources source into this loader module's compile, mirroring
// multiloader-loader.gradle (NeoForge) but for Fabric Loom.
//
// The Loom plugin itself is applied in each :fabric/build.gradle so the Loom
// version stays in one place (root gradle.properties -> fabric_loom_version).
// Requires Java 25 + Gradle 9.5.1 + Loom 1.17-SNAPSHOT for Minecraft 26.2.

plugins {
    id 'multiloader-common'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
    // NOTE: no localRuntime here - Fabric Loom already provides a
    // 'localRuntime' configuration and redeclaring it fails the build.
    // If loader-only runtime deps are ever needed, declare them with
    // Loom's own localRuntime (modLocalRuntime) instead.
}

dependencies {
    def commonProjectPath = project.path.contains(':') ? ":${project.parent.name}:common" : ':common'

    // NOTE: intentionally NO project() dependency here. The common SOURCES are
    // compiled directly into this module (below) with the Fabric classpath
    // (Create Fly + local Sable/Veil stubs). Depending on the :common project
    // would force a standalone :common build against NeoForge deps that do not
    // exist for 26.2. (Upstream multiloader templates do depend on it; that
    // only works when both loaders target the same MC version.)
    commonJava project(path: commonProjectPath, configuration: 'commonJava')
    commonResources project(path: commonProjectPath, configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}
