plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()

    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }

    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

if (project.path.endsWith(":common")) {
    dependencies {
        // fabric/26.2 branch: only artifacts that resolve for 26.2 may stay here.
        // Anything loader/MC-specific that no longer exists was removed; the
        // Fabric modules provide replacements (Create Fly, local Sable/Veil
        // API stubs in :simulated:fabric). Files using removed deps fail
        // compilation until their port pass - see PORTING-NOTES-FABRIC-26.2.md.
        compileOnly "net.neoforged:neoforge:$neoforge_version"
        compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'

        // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
        compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.4.1'
        annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

        // Create Fly replaces the NeoForge Create slim jar on this branch.
        compileOnly("maven.modrinth:create-fly:${create_fly_version}") { transitive = false }

        // REMOVED (no 26.2 artifacts; stubbed or awaiting port passes):
        // - sable-companion-common / sable-neoforge (local API stubs instead)
        // - jei-*-common-api (JEI Fabric rewrite pending)
        // - ponder-neoforge, flywheel-neoforge-api (bundled in Create Fly)
        // - Registrate (vanilla-registry rewrite pending)
        // - veil-common (local API stubs instead)
        // - cc-tweaked / natures-compass / explorers-compass / sodium / iris
        //   (compat re-targeting pending)
    }
}

['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE.md'))
}

jar {
    from(rootProject.file('LICENSE.md'))

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'sable_mod_version_range'            : sable_mod_version_range,
            'create_mod_version'           : create_mod_version,
            'flywheel_mod_version'         : flywheel_mod_version,
            'jei_version'                  : jei_version,
            'jei_min_version'              : jei_min_version,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url = System.getenv('local_maven_url')

            credentials {
                username = System.getenv('local_maven_user')
                password = System.getenv('local_maven_token')
            }

            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}
