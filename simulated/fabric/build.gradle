// Fabric loader module for Create Simulated (Minecraft 26.2 + Create Fly).
// Mirrors simulated:neoforge but targets Fabric Loom. Common code + resources
// are wired in via the multiloader-fabric convention.

plugins {
    id 'multiloader-fabric'
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
}

loom {
    // NOTE: single source set (no splitEnvironmentSourceSets): Sable/Veil
    // API stubs and common code mix client and server classes, so main must
    // compile against full (client+server) mappings.
    mods {
        "simulated" {
            sourceSet sourceSets.main
        }
    }

    // TODO(port): convert simulated.accesswidener (Fabric access-widener format,
    // already v2 named) and point Loom at it once common code compiles, e.g.:
    // accessWidenerPath = project(':simulated:common').file('src/main/resources/simulated.accesswidener')
}

repositories {
    // NOTE: Modrinth exclusiveContent lives in the ROOT build.gradle
    // (declaring it here too breaks resolution - duplicate exclusive repos).
    maven {
        name = 'ryanhcode-releases'
        url = 'https://maven.ryanhcode.dev/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Create Fly: Fabric port of Create for 26.2. Mod id is still "create",
    // packages moved com.simibubi.create -> com.zurrtum.create.
    // https://github.com/ZurrTum/Create-Fly (branch 26.2)
    implementation "maven.modrinth:create-fly:${create_fly_version}"

    // fastutil: used in Sable/Veil API signatures (local stubs)
    compileOnly("it.unimi.dsi:fastutil:8.5.15")

    // jsr305: javax.annotation (Nullable etc.) used across common code
    compileOnly("com.google.code.findbugs:jsr305:3.0.2")

    // CC: Tweaked (Fabric 26.2) for ComputerCraft compat
    compileOnly("cc.tweaked:cc-tweaked-26.2-fabric:1.120.2")

    // Veil shader toolchain (signatures used by local Veil stubs)
    compileOnly("gg.moonflower:molang-compiler:3.1.1.19")
    compileOnly("io.github.ocelot:glsl-processor:0.2.3")

    // TODO(port): add Fabric variants of the remaining libs once 26.2 builds exist:
    // - Sable Fabric + sable-companion-fabric (https://maven.ryanhcode.dev/releases)
    // - Veil Fabric (foundry.veil:veil-fabric-<mc>:<ver>)
    // - JEI Fabric (mezz.jei:jei-<mc>-fabric-api / jei-<mc>-fabric)
    // - Trinkets (replaces Curios on Fabric)
    // - CC:Tweaked Fabric (cc.tweaked:cc-tweaked-<mc>-fabric)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
