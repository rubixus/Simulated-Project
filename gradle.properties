# Shared Project Settings (fabric/26.2 branch: targets Minecraft 26.2 + Fabric + Create Fly)
# NOTE: NeoForge modules in this branch still reference NeoForge 21.x / MC 1.21.1
# and will need their own update pass. Build with Java 25 + Gradle 9.5.1.
java_version=25

# Mod
mod_version=1.3.2
license=Read attached LICENSE.md

# Minecraft
minecraft_version=26.2
minecraft_version_range=[26.2]

# Parchment Mappings
# https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric (26.2 branch: verified against create-deco-fly + Create Fly 26.2)
## https://fabricmc.net/develop
fabric_version=0.154.2+26.2
fabric_loader_version=0.19.3
fabric_loom_version=1.17-SNAPSHOT

# Create Fly (Fabric port of Create used by this branch, mod id is still "create")
## https://modrinth.com/mod/create-fly
## https://github.com/ZurrTum/Create-Fly (default branch 26.2)
create_fly_version=26.2-rc-2-6.0.9-1

# Neoform
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430

# NeoForge
## https://projects.neoforged.net/neoforged/neoforge
neoforge_version=21.1.247
neoforge_loader_version_range=[4,)

# Dependencies
veil_version=4.3.2
sable_version=2.0.4-37
sable_companion_version=1.6.0

create_version=6.0.10-280
ponder_version=1.0.81
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# only change when mods.toml/fabric.mod.json should be updated
create_mod_version = 6.0.10
sable_mod_version_range = [2.0.0,3.0.0)
flywheel_mod_version = 1.0.6
jei_version = 19.44.0.406
jei_min_version = 19.21.0.247

# Mod Integration
computercraft_tweaked_version = 1.115.1
natures_compass_version = 3.4.0
explorers_compass_version = 3.4.0
curios_version=9.2.2
sodium_version=mc1.21.1-0.6.13-neoforge
iris_version=1.8.12+1.21.1-neoforge

# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
