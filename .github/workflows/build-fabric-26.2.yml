name: Build Fabric 26.2 modules

on:
  push:
    branches: ["fabric/26.2"]
  pull_request:
    branches: ["fabric/26.2"]
  workflow_dispatch:

jobs:
  build-fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle 9.5.1
        uses: gradle/actions/wrapper-validation@v4
      - name: Build Fabric modules
        run: ./gradlew :simulated:fabric:build :aeronautics:fabric:build :offroad:fabric:build --stacktrace
